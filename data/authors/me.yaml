bio: |
  I'm an undergraduate aerospace engineering researcher at the University of Cincinnati,
  working with Prof. Prashant Khare and Dr. Kamin Manu in the Multiphase Flow and
  Combustion Laboratory. My work focuses on high-speed compressible flows, multiphase
  dynamics, reacting flows, and machine-learning-accelerated CFD. I'm preparing to
  pursue a PhD in this area.

